[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qckdrw"
version = "0.1.0"
description = "A quick drawing canvas for Windows and macOS"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6==6.12.0",
]

[project.optional-dependencies]
build = [
    "PyInstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.9",
]

[project.gui-scripts]
qckdrw = "qckdrw.main:main"

[tool.setuptools.packages.find]
where = ["src"]
